<!doctype html>
<html lang="pt-BB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currículos // Acesso Restrito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --text: #0f172a;
        --text-secondary: #64748b;
        --border: #e2e8f0;
        --danger: #ef4444;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .login-card h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
      }
      .login-card p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 32px;
      }
      .form-group {
        text-align: left;
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgb(99 102 241 / 0.15);
      }
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s;
        background: var(--primary);
        color: white;
      }
      .btn:hover { background: var(--primary-dark); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .error {
        background: #fef2f2;
        color: var(--danger);
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .links {
        margin-top: 24px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
      }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>📄 Currículos</h1>
      <p>Faça login para acessar o sistema</p>

      <div class="error" id="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn" id="submit-btn">Entrar</button>
      </form>

      <div class="links">
        <a href="/envia-promo">← Voltar para Promo Monitor</a>
      </div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            })
          });
          const data = await res.json();

          if (data.success) {
            window.location.href = '/envia-curriculo';
          } else {
            errorMsg.textContent = data.message || 'Credenciais inválidas';
            errorMsg.style.display = 'block';
          }
        } catch (err) {
          errorMsg.textContent = 'Erro de conexão';
          errorMsg.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
        }
      });
    </script>
  </body>
</html>
