<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currículos — Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --ink: #1a1a2e; --ink-muted: #6b6b8a; --paper: #faf9f7; --cream: #eee9e2; --gold: #c9a84c; --gold-dim: #b8963f; --gold-glow: rgba(201,168,76,0.15); --rose: #c45b5b; --rose-glow: rgba(196,91,91,0.1); --radius: 6px; }
      body { font-family: 'Source Sans 3', Georgia, serif; background: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 30% 20%, rgba(201,168,76,0.06) 0%, transparent 60%); pointer-events: none; }
      .card { background: white; border-radius: 12px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
      .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-dim)); border-radius: 12px 12px 0 0; }
      .card h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
      .card p { color: var(--ink-muted); font-size: 14px; margin-bottom: 28px; }
      .field { margin-bottom: 18px; }
      .field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--ink-muted); margin-bottom: 6px; }
      .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--cream); border-radius: var(--radius); font-family: 'Source Sans 3', sans-serif; font-size: 15px; color: var(--ink); background: var(--paper); transition: all 0.25s; }
      .field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); background: white; }
      .btn { width: 100%; padding: 13px; border: none; border-radius: var(--radius); font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s; background: var(--ink); color: white; letter-spacing: 0.2px; }
      .btn:hover { background: #2d2d44; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,26,46,0.3); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
      .error { background: var(--rose-glow); color: var(--rose); border: 1px solid rgba(196,91,91,0.2); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
      .links { margin-top: 24px; text-align: center; font-size: 13px; }
      .links a { color: var(--gold); text-decoration: none; font-weight: 500; transition: color 0.2s; }
      .links a:hover { color: var(--gold-dim); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Currículos</h1>
      <p>Acesse o sistema de geração automatizada</p>
      <div class="error" id="error-msg"></div>
      <form id="login-form">
        <div class="field"><label for="username">Usuário</label><input type="text" id="username" autocomplete="username" required /></div>
        <div class="field"><label for="password">Senha</label><input type="password" id="password" autocomplete="current-password" required /></div>
        <button type="submit" class="btn" id="submit-btn">Entrar</button>
      </form>
      <div class="links"><a href="/envia-promo">← Promo Monitor</a></div>
    </div>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault(); const em = document.getElementById("error-msg"); const b = document.getElementById("submit-btn");
        em.style.display = "none"; b.disabled = true; b.textContent = "Entrando…";
        try { const r = await fetch("/api/auth/login", { method: "POST", headers: {"Content-Type":"application/json"}, credentials: "include", body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value }) });
        const d = await r.json(); if (d.success) window.location.href = "/envia-curriculo"; else { em.textContent = d.message || "Credenciais inválidas"; em.style.display = "block"; } }
        catch (err) { em.textContent = "Erro de conexão"; em.style.display = "block"; } finally { b.disabled = false; b.textContent = "Entrar"; }
      });
    </script>
  </body>
</html>
